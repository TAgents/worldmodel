name: Engine CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Python and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: world_model_test
          POSTGRES_USER: world_model
          POSTGRES_PASSWORD: world_model_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U world_model -d world_model_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WORLD_MODEL_TEST_DATABASE_URL: postgresql://world_model:world_model_ci@127.0.0.1:5432/world_model_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install engine and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run every Python test with a required database connection
        run: python scripts/check_postgres.py
      - name: Build distributable package
        run: python -m pip wheel . --no-deps --wheel-dir dist

  explorer:
    name: Explorer interactions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WORLD_MODEL_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: npm test
